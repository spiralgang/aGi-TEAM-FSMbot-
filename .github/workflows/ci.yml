
name: FSMAssist CI

on:
  workflow_call:
    inputs:
      run_build:
        description: "Whether to run the production build step"
        required: false
        type: boolean
        default: true 
    secrets:
      npm_token:
        description: "Token for authenticating with the npm registry when required."
        required: false
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.npm_token }}

    - name: Install Dependencies
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ secrets.npm_token }}

    - name: Run Lint Check
      run: npm run lint

    - name: Run Type Check
      run: npm run typecheck

    - name: Run Build
      if: ${{ inputs.run_build != false }}
      run: npm run build
