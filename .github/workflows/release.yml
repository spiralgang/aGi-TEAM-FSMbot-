name: Build and Release Production APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        id: decode_keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Create local.properties
        run: |
          {
            echo "signing.storeFile=$(pwd)/keystore.jks";
            echo "signing.keyAlias=${{ secrets.KEY_ALIAS }}";
            echo "signing.storePassword=${{ secrets.KEYSTORE_PASSWORD }}";
            echo "signing.keyPassword=${{ secrets.KEY_PASSWORD }}";
          } > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Release APK
        run: ./gradlew assembleRelease

      - name: Get APK file name
        id: get_apk
        run: echo "APK_PATH=$(ls app/build/outputs/apk/release/*.apk)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.get_apk.outputs.APK_PATH }}
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Keystore
        if: always()
        run: rm -f keystore.jks
