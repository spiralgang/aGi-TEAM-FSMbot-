name: aGi CI Automation

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to operate on'
        required: true
        default: 'develop'
      run_mode:
        description: 'ci or repair'
        required: true
        default: 'ci'
        type: choice
        options:
          - ci
          - repair
      python_version:
        description: 'Python version for matrix'
        required: true
        default: '3.11'
      run_stamp:
        description: 'Write forensic provenance file'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['${{ github.event.inputs.python_version || '3.11' }}']
    timeout-minutes: 40

    steps:
      - name: Clarity banner
        run: |
          echo "=== aGi CI Automation ==="
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Mode: ${{ github.event.inputs.run_mode }} | Branch: ${{ github.event.inputs.target_branch }} | Python: ${{ matrix.python }}"
          else
            echo "Mode: ci | Branch: ${{ github.ref }} | Python: ${{ matrix.python }}"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          CUR=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CUR" != "${{ github.event.inputs.target_branch }}" ]; then
            echo "Checked out $CUR; expected ${{ github.event.inputs.target_branch }}"; exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "agi-ci-bot"
          git config user.email "agi-ci-bot@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f package.json ]; then npm install; fi

      - name: Lint
        run: |
          if command -v flake8 >/dev/null 2>&1; then
            flake8 src || ( echo "flake8 failed"; exit 1 )
          elif [ -f package.json ]; then
            if command -v npm >/dev/null 2>&1; then
              npm ci || true
              npm run lint || true
            fi
          else
            echo "No linter configured; skipping"
          fi

      - name: Unit tests
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest -q || ( echo "pytest failed"; exit 1 )
          elif [ -f package.json ]; then
            npm test || ( echo "npm test failed"; exit 1 )
          else
            echo "No test runner found; skipping"
          fi

      - name: Static security scan
        run: |
          if command -v bandit >/dev/null 2>&1; then
            bandit -r src || true
          fi
          if command -v safety >/dev/null 2>&1; then
            safety check || true
          fi

      - name: Build artifact (if present)
        run: |
          if [ -f setup.py ] || [ -f pyproject.toml ]; then
            python -m pip install build
            python -m build || echo "build failed"
          elif [ -f package.json ]; then
            npm run build || echo "npm build failed"
          else
            echo "No build step detected; skipping"
          fi

      - name: Create infra directory
        run: mkdir -p infra

      - name: Forensic stamp
        if: ${{ github.event.inputs.run_stamp == 'true' || github.event_name != 'workflow_dispatch' }}
        run: |
          chmod +x infra/forensic_stamp.sh
          infra/forensic_stamp.sh infra/FORGE_STAMP.txt
          git add infra/FORGE_STAMP.txt
          git commit -m "chore: forensic stamp run ${{ github.run_id }}" || echo "no changes to commit"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agi-ci-artifacts
          path: |
            dist/
            build/
            .pytest_cache/
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "=== JOB SUMMARY ===" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "branch: ${{ github.event.inputs.target_branch }}" >> $GITHUB_STEP_SUMMARY
            echo "mode: ${{ github.event.inputs.run_mode }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
            echo "mode: ci" >> $GITHUB_STEP_SUMMARY
          fi
          echo "python: ${{ matrix.python }}" >> $GITHUB_STEP_SUMMARY
          if [ -f infra/FORGE_STAMP.txt ]; then echo "stamp: infra/FORGE_STAMP.txt" >> $GITHUB_STEP_SUMMARY; fi
